[project]
name = "fde-maintenance-agent"
version = "0.1.0"
description = "Equipment-alert Agent and human-approved work-order workflow adapted from LangGraph ReAct."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1,<2",
  "openai>=2.45,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "mcp>=1.9,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
retrieval = ["sentence-transformers>=3,<6"]

[project.scripts]
maintenance-agent = "react_agent.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["react_agent*", "mcp_server*"]

[tool.setuptools.package-data]
react_agent = ["data/*.json", "data/maintie/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["live: calls the configured DeepSeek service; run explicitly"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
