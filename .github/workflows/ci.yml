name: Check maintenance workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e '.[dev]' --no-deps
      - run: python -m ruff check src tests scripts mcp_server evals
      - run: python -m pytest -q --junitxml=reports/ci-tests.xml
# CI uses scripted model fixtures only. Live provider checks are explicit local commands.
